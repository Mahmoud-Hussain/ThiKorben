<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Set up your profile</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "surface-container-highest": "#e4e1ea",
                        "outline-variant": "#c7c5d4",
                        "surface-container-high": "#eae7f0",
                        "surface-tint": "#4f54b4",
                        "primary-container": "#2e3192",
                        "surface-bright": "#fcf8ff",
                        "surface-variant": "#e4e1ea",
                        "surface-dim": "#dbd9e1",
                        "on-secondary-container": "#663800",
                        "on-tertiary-fixed": "#341100",
                        "on-primary": "#ffffff",
                        "error-container": "#ffdad6",
                        "error": "#ba1a1a",
                        "tertiary": "#491a00",
                        "secondary": "#8c4f00",
                        "inverse-primary": "#c0c1ff",
                        "on-secondary-fixed-variant": "#6b3b00",
                        "surface-container-lowest": "#ffffff",
                        "primary-fixed": "#e1e0ff",
                        "outline": "#777683",
                        "on-background": "#1b1b21",
                        "primary-fixed-dim": "#c0c1ff",
                        "on-error-container": "#93000a",
                        "on-primary-fixed": "#04006d",
                        "primary": "#15157d",
                        "surface": "#fcf8ff",
                        "on-primary-container": "#9da1ff",
                        "on-secondary": "#ffffff",
                        "surface-container": "#f0ecf5",
                        "inverse-surface": "#303036",
                        "on-tertiary-fixed-variant": "#773207",
                        "on-surface-variant": "#464652",
                        "on-secondary-fixed": "#2d1600",
                        "on-surface": "#1b1b21",
                        "tertiary-fixed-dim": "#ffb692",
                        "tertiary-container": "#6c2a00",
                        "secondary-fixed": "#ffdcbf",
                        "secondary-container": "#fd9923",
                        "secondary-fixed-dim": "#ffb874",
                        "surface-container-low": "#f5f2fb",
                        "background": "#fcf8ff",
                        "on-error": "#ffffff",
                        "tertiary-fixed": "#ffdbcb",
                        "on-primary-fixed-variant": "#373a9b",
                        "on-tertiary": "#ffffff",
                        "on-tertiary-container": "#f19160",
                        "inverse-on-surface": "#f2eff8"
                    },
                    "borderRadius": {
                        "DEFAULT": "1rem",
                        "lg": "2rem",
                        "xl": "3rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "sm": "8px",
                        "margin-mobile": "20px",
                        "gutter": "16px",
                        "xl": "32px",
                        "2xl": "48px",
                        "lg": "24px",
                        "xs": "4px",
                        "md": "16px",
                        "base": "4px"
                    },
                    "fontFamily": {
                        "body-md": ["Inter"],
                        "display": ["Inter"],
                        "headline-lg": ["Inter"],
                        "headline-md": ["Inter"],
                        "label-md": ["Inter"],
                        "label-lg": ["Inter"],
                        "headline-lg-mobile": ["Inter"],
                        "body-lg": ["Inter"]
                    },
                    "fontSize": {
                        "body-md": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
                        "display": ["32px", { "lineHeight": "40px", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "headline-lg": ["24px", { "lineHeight": "32px", "letterSpacing": "-0.01em", "fontWeight": "700" }],
                        "headline-md": ["20px", { "lineHeight": "28px", "fontWeight": "600" }],
                        "label-md": ["12px", { "lineHeight": "16px", "fontWeight": "500" }],
                        "label-lg": ["14px", { "lineHeight": "20px", "letterSpacing": "0.05em", "fontWeight": "600" }],
                        "headline-lg-mobile": ["22px", { "lineHeight": "28px", "fontWeight": "700" }],
                        "body-lg": ["18px", { "lineHeight": "28px", "fontWeight": "400" }]
                    }
                }
            }
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
</head>
<body class="bg-background text-on-background min-h-screen font-body-md antialiased pb-24">
<!-- Top Navigation Area - Simplified for Onboarding/Transactional -->
<header class="w-full px-margin-mobile pt-8 pb-4 flex justify-between items-center max-w-md mx-auto">
<button class="text-on-surface-variant hover:bg-surface-container-low rounded-full p-2 transition-colors active:scale-95 flex items-center justify-center">
<span class="material-symbols-outlined text-[24px]">arrow_back</span>
</button>
<div class="font-display text-display text-primary">ThiKorben</div>
<div class="w-10"></div> <!-- Spacer for centering -->
</header>
<main class="w-full max-w-md mx-auto px-margin-mobile flex flex-col gap-xl">
<!-- Header Section -->
<section class="flex flex-col gap-sm">
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-on-background">Set up your profile</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Tell us a little about yourself.</p>
</section>
<!-- Form Section -->
<form class="flex flex-col gap-lg">
<!-- Profile Photo Upload -->
<div class="flex flex-col items-center justify-center gap-sm mt-4">
<div class="relative w-32 h-32 rounded-full bg-surface-container-high border-2 border-dashed border-outline-variant flex items-center justify-center cursor-pointer hover:bg-surface-container-highest transition-colors active:scale-95">
<span class="material-symbols-outlined text-[48px] text-primary" style="font-variation-settings: 'FILL' 1;">add_a_photo</span>
<input accept="image/*" class="absolute inset-0 w-full h-full opacity-0 cursor-pointer" type="file"/>
</div>
<span class="font-label-md text-label-md text-primary">Upload Photo</span>
</div>
<!-- Full Name Field -->
<div class="flex flex-col gap-xs">
<label class="font-label-lg text-label-lg text-on-background ml-4" for="fullName">Full Name</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-outline">person</span>
<input class="w-full bg-surface-container-lowest border border-outline-variant rounded-lg py-4 pl-12 pr-4 font-body-md text-body-md text-on-background placeholder:text-outline focus:outline-none focus:ring-2 focus:ring-primary focus:border-primary transition-all" id="fullName" placeholder="e.g. Rahim Uddin" type="text"/>
</div>
</div>
<!-- Phone Number Field -->
<div class="flex flex-col gap-xs">
<label class="font-label-lg text-label-lg text-on-background ml-4" for="phoneNumber">Phone Number</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-outline">call</span>
<input class="w-full bg-surface-container-lowest border border-outline-variant rounded-lg py-4 pl-12 pr-4 font-body-md text-body-md text-on-background placeholder:text-outline focus:outline-none focus:ring-2 focus:ring-primary focus:border-primary transition-all" id="phoneNumber" placeholder="e.g. 01XXXXXXXXX" type="tel"/>
</div>
</div>
<!-- Home Location Field -->
<div class="flex flex-col gap-xs">
<label class="font-label-lg text-label-lg text-on-background ml-4" for="homeLocation">Home Location</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-outline">location_on</span>
<input class="w-full bg-surface-container-lowest border border-outline-variant rounded-lg py-4 pl-12 pr-4 font-body-md text-body-md text-on-background placeholder:text-outline focus:outline-none focus:ring-2 focus:ring-primary focus:border-primary transition-all" id="homeLocation" placeholder="Search for your address" type="text"/>
</div>
</div>
<!-- Optional: Emergency Contact -->
<div class="flex flex-col gap-xs mt-2">
<div class="flex justify-between items-center ml-4">
<label class="font-label-lg text-label-lg text-on-background" for="emergencyContact">Emergency Contact</label>
<span class="font-label-md text-label-md text-outline">Optional</span>
</div>
<div class="relative">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-outline">contact_phone</span>
<input class="w-full bg-surface-container-lowest border border-outline-variant rounded-lg py-4 pl-12 pr-4 font-body-md text-body-md text-on-background placeholder:text-outline focus:outline-none focus:ring-2 focus:ring-primary focus:border-primary transition-all" id="emergencyContact" placeholder="e.g. 01XXXXXXXXX" type="tel"/>
</div>
</div>
</form>
<!-- Actions Section -->
<div class="flex flex-col gap-md mt-xl pt-lg border-t border-surface-container-high">
<button class="w-full bg-[#F7941D] text-white font-label-lg text-label-lg rounded-2xl py-4 h-[56px] flex items-center justify-center active:scale-95 transition-transform duration-200 shadow-md">
                Continue
            </button>
<button class="w-full bg-transparent text-primary font-label-lg text-label-lg py-4 flex items-center justify-center active:scale-95 transition-transform duration-200">
                Skip for now
            </button>
</div>
</main>
</body></html>
