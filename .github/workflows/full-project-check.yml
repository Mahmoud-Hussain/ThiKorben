name: Full Project Check

on:
  push:
    branches:
      - chore/full-project-check-20261006
  pull_request:
    branches:
      - dev
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: "true"
      EXPO_NO_TELEMETRY: "1"
      EXPO_PUBLIC_SUPABASE_URL: "https://example.supabase.co"
      EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: "ci-placeholder-key"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Expo doctor
        id: doctor
        continue-on-error: true
        run: npx expo-doctor

      - name: TypeScript
        id: typescript
        continue-on-error: true
        run: npx tsc --noEmit

      - name: Lint
        id: lint
        continue-on-error: true
        run: npm run lint

      - name: Export web bundle
        id: build
        continue-on-error: true
        run: npm run build:web

      - name: Validation summary
        if: always()
        run: |
          echo "Expo Doctor: \${{ steps.doctor.outcome }}"
          echo "TypeScript:   \${{ steps.typescript.outcome }}"
          echo "Lint:         \${{ steps.lint.outcome }}"
          echo "Web export:   \${{ steps.build.outcome }}"
          if [ "\${{ steps.doctor.outcome }}" != "success" ] || \
             [ "\${{ steps.typescript.outcome }}" != "success" ] || \
             [ "\${{ steps.lint.outcome }}" != "success" ] || \
             [ "\${{ steps.build.outcome }}" != "success" ]; then
            exit 1
          fi
