<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>ThiKorben - Onboarding</title>
<!-- Material Symbols -->
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>

<!-- Tailwind CSS -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Tailwind Configuration -->

      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "surface-container-highest": "#e4e1ea",

                    "on-secondary-container": "#663800",
                    "on-tertiary-fixed": "#341100",
                    "on-primary": "#ffffff",
                    "error-container": "#ffdad6",
                    "error": "#ba1a1a",
                    "tertiary": "#491a00",
                    "secondary": "#8c4f00",
                    "inverse-primary": "#c0c1ff",
                    "on-secondary-fixed-variant": "#6b3b00",
                    "surface-container-lowest": "#ffffff",
                    "primary-fixed": "#e1e0ff",
                    "outline": "#777683",
                    "on-background": "#1b1b21",
                    "primary-fixed-dim": "#c0c1ff",
                    "on-error-container": "#93000a",
                    "on-primary-fixed": "#04006d",
                    "primary": "#15157d",
                    "surface": "#fcf8ff",
                    "on-primary-container": "#9da1ff",
                    "on-secondary": "#ffffff",
                    "surface-container": "#f0ecf5",
                    "inverse-surface": "#303036",
                    "on-tertiary-fixed-variant": "#773207",
                    "on-surface-variant": "#464652",
                    "on-secondary-fixed": "#2d1600",
                    "on-surface": "#1b1b21",
                    "tertiary-fixed-dim": "#ffb692",
                    "tertiary-container": "#6c2a00",
                    "secondary-fixed": "#ffdcbf",
                    "secondary-container": "#fd9923",
                    "secondary-fixed-dim": "#ffb874",
                    "surface-container-low": "#f5f2fb",
                    "background": "#fcf8ff",
                    "on-error": "#ffffff",
                    "tertiary-fixed": "#ffdbcb",
                    "on-primary-fixed-variant": "#373a9b",
                    "on-tertiary": "#ffffff",
                    "on-tertiary-container": "#f19160",
                    "inverse-on-surface": "#f2eff8"
            },
            "borderRadius": {
                    "DEFAULT": "1rem",
                    "lg": "2rem",
                    "xl": "3rem",

            },
            "spacing": {
                    "sm": "8px",
                    "margin-mobile": "20px",
                    "gutter": "16px",
                    "xl": "32px",
                    "2xl": "48px",
                    "lg": "24px",
                    "xs": "4px",
                    "md": "16px",
                    "base": "4px"
            },
            "fontFamily": {
                    "body-md": ["Inter"],
                    "display": ["Inter"],
                    "headline-lg": ["Inter"],
                    "headline-md": ["Inter"],
                    "label-md": ["Inter"],
                    "label-lg": ["Inter"],
                    "headline-lg-mobile": ["Inter"],
                    "body-lg": ["Inter"]
            },
            "fontSize": {
                    "body-md": ["16px", {"lineHeight": "24px", "fontWeight": "400"}],
                    "display": ["32px", {"lineHeight": "40px", "letterSpacing": "-0.02em", "fontWeight": "700"}],
                    "headline-lg": ["24px", {"lineHeight": "32px", "letterSpacing": "-0.01em", "fontWeight": "700"}],

<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .icon-fill {
            font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
</head>
<body class="bg-background min-h-screen flex flex-col items-center justify-center px-margin-mobile">
<!-- Main Container (Mobile Constrained) -->
<main class="w-full max-w-md flex flex-col h-screen py-8">
<!-- Header Section -->
<header class="mt-8 mb-10">
<h1 class="font-display text-display text-on-background">
                How will you use <span class="text-primary">ThiKorben</span>?
            </h1>
<p class="font-body-lg text-body-lg text-on-surface-variant mt-sm">
                Select your account type to personalize your experience.
            </p>
</header>
<!-- Selection Cards Container -->
<div class="flex flex-col gap-md flex-grow">
<!-- Card 1: Customer (Selected State) -->
<button class="w-full text-left bg-surface-container-low border-2 border-primary rounded-xl p-6 relative transition-all active:scale-95 shadow-[0_8px_20px_rgba(21,21,125,0.1)] group overflow-hidden">
<!-- Selection Indicator -->
<div class="absolute top-5 right-5 text-primary">
<span class="material-symbols-outlined icon-fill text-[28px]">check_circle</span>
</div>
<!-- Icon Badge -->
<div class="w-14 h-14 rounded-full bg-primary-fixed flex items-center justify-center mb-5 text-on-primary-fixed shadow-sm">
<span class="material-symbols-outlined text-[32px]">home</span>
</div>
<h2 class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface mb-xs">I'm a Customer</h2>
<p class="font-body-md text-body-md text-on-surface-variant pr-8">Find trusted workers for your home.</p>
<!-- Decorative background accent -->
<div class="absolute -bottom-8 -right-8 w-32 h-32 bg-primary opacity-5 rounded-full blur-2xl pointer-events-none"></div>
</button>
<!-- Card 2: Worker (Unselected State) -->
<button class="w-full text-left bg-surface border border-outline-variant rounded-xl p-6 relative transition-all hover:bg-surface-container-lowest hover:border-primary active:scale-95 shadow-sm group overflow-hidden">
<!-- Selection Indicator -->
<div class="absolute top-5 right-5 text-outline-variant group-hover:text-primary transition-colors">
<span class="material-symbols-outlined text-[28px]">circle</span>
</div>
<!-- Icon Badge -->
<div class="w-14 h-14 rounded-full bg-surface-container flex items-center justify-center mb-5 text-on-surface-variant group-hover:bg-primary-fixed group-hover:text-on-primary-fixed transition-colors shadow-sm">
<span class="material-symbols-outlined text-[32px]">engineering</span>
</div>
<h2 class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface mb-xs">I'm a Worker</h2>
<p class="font-body-md text-body-md text-on-surface-variant pr-8">Find local jobs and grow your services.</p>
</button>
</div>
<!-- Sticky Bottom CTA -->
<div class="mt-auto pt-8 pb-4 w-full">
<button class="w-full bg-secondary-container text-on-secondary font-label-lg text-label-lg h-14 rounded-full shadow-[0_4px_12px_rgba(253,153,35,0.3)] active:scale-95 transition-transform flex items-center justify-center gap-2 hover:bg-secondary">
                Continue
                <span class="material-symbols-outlined">arrow_forward</span>
</button>
</div>
</main>
</body></html>
