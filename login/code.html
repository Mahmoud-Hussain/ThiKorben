<div class="z-10 text-center max-w-lg">
<h1 class="font-display text-display text-on-primary-container mb-lg">ThiKorben</h1>
<p class="font-body-lg text-body-lg text-on-primary-container opacity-90">Connecting skilled tradespeople with households across Bangladesh. Trust, reliability, and local accessibility.</p>
</div>
</div>
<!-- Right Side: Login Form -->
<div class="flex-1 flex flex-col justify-center px-margin-mobile py-xl md:px-2xl bg-surface">
<!-- Language Toggle -->
<div class="flex justify-end mb-xl w-full max-w-md mx-auto md:max-w-full">
<div class="flex items-center space-x-2 bg-surface-container-low rounded-full p-1 border border-outline-variant shadow-sm">
<button class="px-4 py-1.5 rounded-full text-label-md font-label-md text-on-surface-variant hover:bg-surface-container transition-colors">বাংলা</button>
<button class="px-4 py-1.5 rounded-full bg-primary text-on-primary text-label-md font-label-md shadow-sm">English</button>
</div>
</div>
<!-- Form Container -->
<div class="w-full max-w-md mx-auto space-y-lg">
<!-- Header -->
<div>
<h2 class="font-headline-lg-mobile text-headline-lg-mobile md:font-headline-lg md:text-headline-lg text-primary mb-xs">Welcome Back</h2>
<p class="font-body-md text-body-md text-on-surface-variant">Sign in to continue using ThiKorben.</p>
</div>
<!-- Input Field -->
<form class="space-y-lg">
<div class="space-y-1">
<label class="block font-label-md text-label-md text-on-surface" for="phone">Phone Number</label>
<div class="relative flex items-center rounded-lg border border-outline-variant bg-surface-container-lowest focus-within:border-primary-container focus-within:ring-1 focus-within:ring-primary-container transition-all">
<span class="pl-md pr-2 font-body-md text-body-md text-on-surface-variant select-none border-r border-outline-variant py-md">+880</span>
<input class="block w-full border-none bg-transparent py-md pl-sm pr-md font-body-md text-body-md text-on-surface focus:ring-0 placeholder:text-outline" id="phone" name="phone" placeholder="1XXXXXXXXX" required="" type="tel"/>
</div>
</div>
<!-- Primary CTA -->
<button class="w-full flex items-center justify-center bg-secondary-container text-on-secondary-container hover:bg-secondary-fixed hover:text-on-secondary-fixed font-label-lg text-label-lg py-md px-lg rounded-2xl shadow-sm transition-all active:scale-[0.98] min-h-[56px]" type="submit">
                        Continue
                    </button>
</form>
<!-- Divider -->
<div class="flex items-center space-x-4 py-md">
<div class="flex-1 h-px bg-outline-variant opacity-50"></div>
<span class="font-label-md text-label-md text-on-surface-variant uppercase tracking-wider">or</span>

</div>

<div class="space-y-md">
<button class="w-full flex items-center justify-center bg-transparent border border-primary-container text-primary-container hover:bg-primary-container hover:text-on-primary-container font-label-lg text-label-lg py-md px-lg rounded-2xl transition-all min-h-[56px]" type="button">
<span class="material-symbols-outlined mr-sm" style="font-variation-settings: 'FILL' 0;">person</span>
