<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>

<title>Create your account - ThiKorben</title>

                        "outline": "#777683",

                        "on-tertiary-fixed-variant": "#773207",
                        "on-surface-variant": "#464652",
                        "on-secondary-fixed": "#2d1600",
                        "on-surface": "#1b1b21",
                        "tertiary-fixed-dim": "#ffb692",
                        "tertiary-container": "#6c2a00",
                        "secondary-fixed": "#ffdcbf",
                        "secondary-container": "#fd9923",
                        "secondary-fixed-dim": "#ffb874",

                        "on-tertiary": "#ffffff",

                    },

<style>
        .input-ring-focus:focus-within {
            box-shadow: 0 0 0 2px #2e3192;
            border-color: transparent;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background min-h-screen flex items-center justify-center p-margin-mobile md:p-lg antialiased">
<!-- Top AppBar (Mobile Only) - Adjusted for non-nav flow -->
<header class="fixed top-0 w-full z-50 bg-surface shadow-sm flex justify-between items-center px-margin-mobile h-16 max-w-md mx-auto md:hidden left-0 right-0">
<button class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-surface-container-low transition-colors text-on-surface-variant active:scale-95">
<span class="material-symbols-outlined" data-icon="arrow_back">arrow_back</span>
</button>
<h1 class="font-display text-display text-primary text-[20px] leading-tight">ThiKorben</h1>
<div class="w-10 h-10"></div> <!-- Spacer -->
</header>
<main class="w-full max-w-md mx-auto bg-surface-container-lowest rounded-[2rem] md:rounded-[3rem] shadow-[0_4px_12px_rgba(0,0,0,0.06)] overflow-hidden mt-16 md:mt-0 relative pb-10">
<!-- Decorative Top Blob -->
<div class="absolute top-0 left-0 w-full h-32 bg-gradient-to-b from-primary-fixed/30 to-transparent pointer-events-none rounded-t-[2rem] md:rounded-t-[3rem]"></div>
<div class="p-lg md:p-xl relative z-10 pt-xl">
<!-- Header Section -->
<div class="text-center mb-xl">
<h1 class="font-headline-lg-mobile md:font-headline-lg text-headline-lg-mobile md:text-headline-lg text-on-surface mb-sm">Create your account</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Join ThiKorben and connect with trusted local services.</p>
</div>
<!-- Form Section -->
<form class="space-y-md">
<!-- Full Name Field (Error State Example) -->
<div>
<label class="block font-label-lg text-label-lg text-on-surface mb-xs ml-sm" for="fullName">Full Name</label>
<div class="relative flex items-center rounded-lg bg-error-container/20 border border-error input-ring-focus transition-all duration-200">
<span class="material-symbols-outlined absolute left-md text-error" data-icon="person">person</span>
<input aria-describedby="name-error" aria-invalid="true" class="w-full bg-transparent border-none py-md pl-12 pr-md rounded-lg font-body-md text-body-md text-on-surface focus:ring-0 placeholder:text-outline-variant outline-none" id="fullName" placeholder="e.g. Karim Rahman" type="text"/>
</div>
<p class="font-label-md text-label-md text-error mt-xs ml-sm flex items-center gap-1" id="name-error">
<span class="material-symbols-outlined text-[14px]" data-icon="error">error</span>
                        Please enter your full name.
                    </p>
</div>
<!-- Phone Number Field (Valid State Example) -->
<div>
<label class="block font-label-lg text-label-lg text-on-surface mb-xs ml-sm" for="phone">Phone Number</label>
<div class="relative flex items-center rounded-lg bg-surface border border-outline-variant input-ring-focus transition-all duration-200">
<span class="material-symbols-outlined absolute left-md text-outline" data-icon="call">call</span>
<div class="absolute left-[3.25rem] font-body-md text-body-md text-on-surface-variant border-r border-outline-variant pr-2">+880</div>
<input class="w-full bg-transparent border-none py-md pl-[5.5rem] pr-12 rounded-lg font-body-md text-body-md text-on-surface focus:ring-0 placeholder:text-outline-variant outline-none" id="phone" type="tel" value="1712345678"/>
<span class="material-symbols-outlined absolute right-md text-[#27AE60]" data-icon="check_circle">check_circle</span>
</div>
<p class="font-label-md text-label-md text-[#27AE60] mt-xs ml-sm flex items-center gap-1">
<span class="material-symbols-outlined text-[14px]" data-icon="check">check</span>
                        Valid phone number
                    </p>
</div>
<!-- Password Field -->
<div>
<label class="block font-label-lg text-label-lg text-on-surface mb-xs ml-sm" for="password">Password</label>
<div class="relative flex items-center rounded-lg bg-surface border border-outline-variant input-ring-focus transition-all duration-200">
<span class="material-symbols-outlined absolute left-md text-outline" data-icon="lock">lock</span>
<input class="w-full bg-transparent border-none py-md pl-12 pr-12 rounded-lg font-body-md text-body-md text-on-surface focus:ring-0 placeholder:text-outline-variant outline-none" id="password" placeholder="••••••••" type="password"/>
<button aria-label="Toggle password visibility" class="absolute right-md text-outline hover:text-on-surface-variant focus:outline-none p-1 rounded-full active:scale-95 transition-transform" type="button">
<span class="material-symbols-outlined" data-icon="visibility_off">visibility_off</span>
</button>
</div>
</div>
<!-- Confirm Password Field -->
<div>
<label class="block font-label-lg text-label-lg text-on-surface mb-xs ml-sm" for="confirmPassword">Confirm Password</label>
<div class="relative flex items-center rounded-lg bg-surface border border-outline-variant input-ring-focus transition-all duration-200">
<span class="material-symbols-outlined absolute left-md text-outline" data-icon="lock_reset">lock_reset</span>
<input class="w-full bg-transparent border-none py-md pl-12 pr-md rounded-lg font-body-md text-body-md text-on-surface focus:ring-0 placeholder:text-outline-variant outline-none" id="confirmPassword" placeholder="••••••••" type="password"/>
</div>
</div>
<!-- Primary CTA -->
<div class="pt-sm">
<button class="w-full bg-[#F7941D] hover:bg-secondary-container text-white font-label-lg text-label-lg h-[56px] rounded-full flex items-center justify-center gap-2 active:scale-95 transition-all duration-200 shadow-[0_8px_20px_rgba(247,148,29,0.15)] hover:shadow-[0_4px_12px_rgba(247,148,29,0.2)]" type="submit">
                        Create Account
                        <span class="material-symbols-outlined text-[20px]" data-icon="arrow_forward">arrow_forward</span>
</button>
</div>
</form>
<!-- Secondary Link -->
<div class="mt-lg text-center">
<a class="font-body-md text-body-md text-on-surface-variant hover:text-primary transition-colors inline-block p-2 active:scale-95 tap-highlight-transparent" href="#">
                    Already have an account? <span class="font-label-lg text-label-lg text-primary">Log In</span>
</a>
</div>
</div>
</main>
<script>
        // Simple password toggle interaction
        document.querySelectorAll('button[aria-label="Toggle password visibility"]').forEach(button => {
            button.addEventListener('click', function() {
                const input = this.previousElementSibling;
                const icon = this.querySelector('span');
                
                if (input.type === 'password') {
                    input.type = 'text';
                    icon.textContent = 'visibility';
                    icon.setAttribute('data-icon', 'visibility');
                } else {
                    input.type = 'password';
                    icon.textContent = 'visibility_off';
                    icon.setAttribute('data-icon', 'visibility_off');
                }
            });
        });
    </script>
</body></html>
