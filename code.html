<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>ThiKorben - Tracking Customer View</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>

<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-secondary-fixed-variant": "#6b3b00",
                        "inverse-surface": "#303036",
                        "primary": "#15157d",
                        "background": "#fcf8ff",
                        "outline-variant": "#c7c5d4",
                        "error-container": "#ffdad6",
                        "tertiary-fixed": "#ffdbcb",
                        "error": "#ba1a1a",
                        "outline": "#777683",
                        "surface-container-highest": "#e4e1ea",
                        "on-tertiary-container": "#f19160",
                        "surface-container-lowest": "#ffffff",
                        "on-secondary-container": "#663800",
                        "on-tertiary": "#ffffff",
                        "surface-container-high": "#eae7f0",
                        "surface-container-low": "#f5f2fb",
                        "surface-dim": "#dbd9e1",
                        "primary-fixed": "#e1e0ff",
                        "surface-tint": "#4f54b4",
                        "on-background": "#1b1b21",
                        "inverse-on-surface": "#f2eff8",
                        "on-primary-container": "#9da1ff",
                        "on-tertiary-fixed": "#341100",
                        "surface-variant": "#e4e1ea",
                        "surface-bright": "#fcf8ff",
                        "on-secondary": "#ffffff",
                        "on-primary-fixed-variant": "#373a9b",
                        "tertiary-container": "#6c2a00",
                        "on-primary-fixed": "#04006d",
                        "primary-container": "#2e3192",
                        "on-error-container": "#93000a",
                        "secondary-fixed-dim": "#ffb874",
                        "primary-fixed-dim": "#c0c1ff",
                        "tertiary": "#491a00",
                        "on-surface-variant": "#464652",
                        "on-tertiary-fixed-variant": "#773207",
                        "on-primary": "#ffffff",
                        "tertiary-fixed-dim": "#ffb692",
                        "secondary-container": "#fd9923",
                        "secondary-fixed": "#ffdcbf",
                        "inverse-primary": "#c0c1ff",
                        "surface-container": "#f0ecf5",
                        "secondary": "#8c4f00",
                        "on-error": "#ffffff",
                        "on-secondary-fixed": "#2d1600",
                        "on-surface": "#1b1b21",
                        "surface": "#fcf8ff"
                    },
                    "borderRadius": {
                        "DEFAULT": "1rem",
                        "lg": "2rem",
                        "xl": "3rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "2xl": "48px",
                        "base": "4px",
                        "gutter": "16px",
                        "margin-mobile": "20px",
                        "xs": "4px",
                        "lg": "24px",
                        "sm": "8px",
                        "md": "16px",
                        "xl": "32px"
                    },
                    "fontFamily": {
                        "body-lg": ["Inter"],
                        "label-md": ["Inter"],
                        "headline-lg": ["Inter"],
                        "headline-lg-mobile": ["Inter"],
                        "headline-md": ["Inter"],
                        "label-lg": ["Inter"],
                        "display": ["Inter"],
                        "body-md": ["Inter"]
                    },
                    "fontSize": {
                        "body-lg": ["18px", { "lineHeight": "28px", "fontWeight": "400" }],
                        "label-md": ["12px", { "lineHeight": "16px", "fontWeight": "500" }],
                        "headline-lg": ["24px", { "lineHeight": "32px", "letterSpacing": "-0.01em", "fontWeight": "700" }],
                        "headline-lg-mobile": ["22px", { "lineHeight": "28px", "fontWeight": "700" }],
                        "headline-md": ["20px", { "lineHeight": "28px", "fontWeight": "600" }],
                        "label-lg": ["14px", { "lineHeight": "20px", "letterSpacing": "0.05em", "fontWeight": "600" }],
                        "display": ["32px", { "lineHeight": "40px", "letterSpacing": "-0.02em", "fontWeight": "700" }],

                }
            }
        }
    </script>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-surface text-on-surface min-h-screen flex flex-col font-body-md overflow-hidden antialiased">
<!-- TopAppBar -->
<header class="fixed top-0 w-full z-50 bg-surface dark:bg-on-background shadow-sm">
<div class="flex justify-between items-center px-margin-mobile h-16 w-full max-w-md mx-auto">
<button class="w-10 h-10 rounded-full bg-surface-container-low flex items-center justify-center hover:bg-surface-container-high transition-colors active:scale-95 text-primary">
<span class="material-symbols-outlined" data-icon="arrow_back">arrow_back</span>
</button>
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-primary font-bold">Track Worker</h1>
<div class="w-10 h-10"></div> <!-- Spacer -->
</div>
</header>
<!-- Main Content Canvas -->
<main class="flex-grow relative mt-16 max-w-md mx-auto w-full h-[calc(100vh-64px)] flex flex-col">
<!-- Map Area -->
<div class="flex-grow relative bg-surface-container-low w-full overflow-hidden">
<!-- Simulated Map Image -->
<img alt="Map Route" class="w-full h-full object-cover opacity-80" data-alt="A detailed map view of Dhaka city streets in a clean, modern digital style. The map features a prominent blue route line indicating a path. The overall color palette is light and neutral with subtle grey roads and light green park areas, typical of a modern ride-sharing app interface." data-location="Dhaka" src="https://lh3.googleusercontent.com/aida-public/AB6AXuDCLleJN6dE9q50iVCgH6j99nECmTiRso27bzXFvYVA3bVd2jK-GtlZXc7g9VZXSVQC4bULuCVXzUJbL0S4sjGUMMQOm2NneC5Y6HtUSbl8YyCCoAW3QkCvTmkj2lOYSAYTUWKs3KcbVgLebm74X1Kbn5CYTjrDyOstOktRbXAIrDYYDPQU0mtmW6A-wkY3lcLmkqDaL39LVxOgUgdsK8tI4ECKHBkQX3Qw_GwR9cOOpEjdkSTyQ8OP5Q"/>
<!-- Map Overlays -->
<div class="absolute inset-0 p-lg pointer-events-none flex flex-col justify-between">
<!-- ETA Badge -->
<div class="self-center mt-sm bg-surface rounded-full px-md py-sm shadow-lg border border-surface-dim flex items-center gap-2 pointer-events-auto">
<span class="material-symbols-outlined text-primary" data-icon="schedule" data-weight="fill">schedule</span>
<span class="font-label-lg text-label-lg text-on-surface">12 min away</span>
</div>
<!-- Pins Container -->
<div class="relative w-full h-full">
<!-- Worker Pin -->
<div class="absolute top-[40%] left-[30%] -translate-x-1/2 -translate-y-full flex flex-col items-center">
<div class="bg-secondary-container text-on-secondary-container rounded-full p-2 shadow-lg z-10 border-2 border-surface">
<span class="material-symbols-outlined" data-icon="handyman">handyman</span>
</div>
<div class="w-1 h-8 bg-secondary-container"></div>
<div class="w-3 h-1 bg-black/20 rounded-full blur-[2px]"></div>
</div>
<!-- Customer Pin -->
<div class="absolute top-[70%] left-[70%] -translate-x-1/2 -translate-y-full flex flex-col items-center">
<div class="bg-primary-container text-on-primary-container rounded-full p-2 shadow-lg z-10 border-2 border-surface">
<span class="material-symbols-outlined" data-icon="home">home</span>
</div>
<div class="w-1 h-8 bg-primary-container"></div>
<div class="w-3 h-1 bg-black/20 rounded-full blur-[2px]"></div>
</div>
</div>
</div>
</div>
<!-- Tracking Details Bottom Sheet / Card -->
<div class="bg-surface rounded-t-xl shadow-[0_-8px_20px_rgba(0,0,0,0.08)] relative z-20 pb-margin-mobile flex flex-col shrink-0">
<!-- Drag Handle -->
<div class="w-full flex justify-center py-3">
<div class="w-12 h-1.5 bg-surface-dim rounded-full"></div>
</div>
<div class="px-margin-mobile flex flex-col gap-lg">
<!-- Status & Profile Header -->
<div class="flex items-center justify-between">
<div class="flex items-center gap-md">
<div class="relative">
<img class="w-14 h-14 rounded-full object-cover border-2 border-surface-container-highest shadow-sm" data-alt="A professional headshot of a friendly Bangladeshi plumber named Rahim, wearing a clean uniform. He is smiling warmly. The background is a soft, blurred bright environment. The image is cropped into a circle." src="https://lh3.googleusercontent.com/aida-public/AB6AXuCv3ndAOA1HXwuXdDv15r5Bfc9c_rxhJyNc2SXzQsu7SuF6OtdDXPeZ_jIU-grZ3O9d4VZ7_K9x7qKeOqpqH6pjTZbPPmTSdjJK2MzxOVaSPjgGqHZwJMKC6h6eJKTNV6aRRU_yvgm5w2L60KMcltF2TyjSfzSbC2yqCiwpGsRgeRxwqS44YOdBOJqmW8D0yi0j3Tb7_ZKpDbdft_DBKHGnIrK9nMnGuAhoe6Ym8J1J3OX6K2SLGLPXOg"/>
<div class="absolute bottom-0 right-0 w-4 h-4 bg-green-500 border-2 border-surface rounded-full"></div>
</div>
<div>
<h2 class="font-headline-md text-headline-md text-on-surface">Rahim is on the way</h2>
<p class="font-body-md text-body-md text-on-surface-variant flex items-center gap-1">
<span class="material-symbols-outlined text-sm text-secondary-container" data-icon="star" data-weight="fill">star</span>
                                4.9 • Plumber
                            </p>
</div>
</div>
</div>
<!-- Action Buttons -->
<div class="flex gap-sm">
<button class="flex-1 bg-[#F7941D] text-white font-label-lg text-label-lg rounded-full py-4 px-6 flex items-center justify-center gap-2 shadow-md active:scale-95 transition-transform duration-150">
<span class="material-symbols-outlined" data-icon="call" data-weight="fill">call</span>
                        Call Worker
                    </button>
<button class="flex-1 bg-primary-container text-on-primary-container font-label-lg text-label-lg rounded-full py-4 px-6 flex items-center justify-center gap-2 shadow-md active:scale-95 transition-transform duration-150">
<span class="material-symbols-outlined" data-icon="chat" data-weight="fill">chat</span>
                        Message
                    </button>
</div>
<hr class="border-t border-surface-variant"/>
<!-- Timeline -->
<div class="flex flex-col gap-4 py-2">
<!-- Step 1: Accepted -->
<div class="flex gap-md relative">
<div class="flex flex-col items-center">
<div class="w-6 h-6 rounded-full bg-[#27AE60] text-white flex items-center justify-center z-10 shrink-0">
<span class="material-symbols-outlined text-[16px]" data-icon="check">check</span>
</div>
<div class="w-[2px] h-full bg-[#27AE60] absolute top-6 bottom-[-16px] left-3 -translate-x-1/2"></div>
</div>
<div class="flex flex-col pb-2">
<span class="font-label-lg text-label-lg text-on-surface">Job Accepted</span>
<span class="font-label-md text-label-md text-on-surface-variant">10:15 AM</span>
</div>
</div>
<!-- Step 2: On the Way (Active) -->
<div class="flex gap-md relative">
<div class="flex flex-col items-center">
<div class="w-6 h-6 rounded-full bg-primary flex items-center justify-center z-10 shrink-0">
<span class="material-symbols-outlined text-[16px] text-white" data-icon="local_shipping">local_shipping</span>
</div>
<div class="w-[2px] h-full bg-surface-variant absolute top-6 bottom-[-16px] left-3 -translate-x-1/2 border-l-2 border-dashed border-outline-variant"></div>
</div>
<div class="flex flex-col pb-2">
<span class="font-label-lg text-label-lg text-primary font-bold">On the Way</span>
<span class="font-label-md text-label-md text-primary">Arriving at 10:45 AM</span>
</div>
</div>
<!-- Step 3: Arrived (Pending) -->
<div class="flex gap-md relative">
<div class="flex flex-col items-center">
<div class="w-6 h-6 rounded-full border-2 border-outline-variant bg-surface flex items-center justify-center z-10 shrink-0">
</div>
<div class="w-[2px] h-full bg-surface-variant absolute top-6 bottom-[-16px] left-3 -translate-x-1/2 border-l-2 border-dashed border-outline-variant"></div>
</div>
<div class="flex flex-col pb-2">
<span class="font-label-lg text-label-lg text-on-surface-variant">Arrived</span>
</div>
</div>
<!-- Step 4: Working (Pending) -->
<div class="flex gap-md relative">
<div class="flex flex-col items-center">
<div class="w-6 h-6 rounded-full border-2 border-outline-variant bg-surface flex items-center justify-center z-10 shrink-0">
</div>
<div class="w-[2px] h-full bg-surface-variant absolute top-6 bottom-[-16px] left-3 -translate-x-1/2 border-l-2 border-dashed border-outline-variant"></div>
</div>
<div class="flex flex-col pb-2">
<span class="font-label-lg text-label-lg text-on-surface-variant">Working</span>
</div>
</div>
<!-- Step 5: Completed (Pending) -->
<div class="flex gap-md relative">
<div class="flex flex-col items-center">
<div class="w-6 h-6 rounded-full border-2 border-outline-variant bg-surface flex items-center justify-center z-10 shrink-0">
</div>
</div>
<div class="flex flex-col">
<span class="font-label-lg text-label-lg text-on-surface-variant">Completed</span>
</div>
</div>
</div>
</div>
</div>
</main>
</body></html>
